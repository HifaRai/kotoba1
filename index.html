   CHAPTER BUTTON
===================================================== */

.chapter-menu {
    display: grid;

.chapter-btn {
    border: none;

    background: #e7dfdc;

    color: #75686a;

    padding: 11px 5px;

    border-radius: 12px;

    font-size: 12px;

    font-weight: 800;

.chapter-btn.active {

/* =====================================================

===================================================== */

}

.mode-btn {

===================================================== */

    border-radius: 15px;

    box-shadow:

.score-item {
    display: flex;

    gap: 2px;
}

.score-label {
    font-size: 9px;

    letter-spacing: 1px;

    color: #a09294;

    font-weight: 800;
}

.score-value {
    font-size: 16px;

    font-weight: 900;

    color: #4b4244;
}

   PROGRESS
===================================================== */

    margin-top: 9px;

    margin-bottom: 12px;

    background: #ded6d3;

    border-radius: 20px;

}

.progress-bar {
    height: 100%;

    width: 0%;

    background: #a99091;

    border-radius: 20px;

/* =====================================================
   QUIZ CARD
===================================================== */

.quiz-card {

===================================================== */

.choice.correct {
    background: #dce9df;

    color: #4d6754;
}

.choice.wrong {
    background: #f0dddd;

        "nextBtn"
    );

const scoreEl =
    document.getElementById(
        "score"
    );

const questionNumber =
    document.getElementById(
        "questionNumber"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );

const chapterBadge =
    document.getElementById(
        "chapterBadge"
    );


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    return [...array].sort(
        () => Math.random() - 0.5
    );

}


/* =====================================================
   START QUIZ
===================================================== */

function startQuiz() {

    let filtered;

    if (
        selectedChapter ===
        "all"
    ) {

        filtered = vocabulary;

    } else {

        filtered =
            vocabulary.filter(
                item =>
                    item.bab ===
                    selectedChapter
            );

    }

    questions =
        shuffle(filtered);

    currentIndex = 0;

    score = 0;

    scoreEl.textContent =
        score;

    showQuestion();

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion() {

    answered = false;

    result.textContent = "";

    result.className = "result";

    nextBtn.style.display =
        "none";


    if (
        currentIndex >=
        questions.length
    ) {

        showFinish();

        return;

    }


    const item =
        questions[currentIndex];


    questionNumber.textContent =
        `${currentIndex + 1} / ${questions.length}`;


    const progress =
        (
            (currentIndex + 1)
            /
            questions.length
        ) * 100;


    progressBar.style.width =
        progress + "%";


    chapterBadge.textContent =
        "BAB " + item.bab;


    /* =================================================
       KANJI → INDONESIA
    ================================================= */

    if (
        selectedMode ===
        "jp-id"
    ) {

        document.getElementById(
            "questionType"
        ).textContent =
            "Apa arti kosakata berikut?";


        question.className =
            "question";


        question.innerHTML = `

            <div class="question-main">
                ${item.jp}
            </div>

            <div class="question-reading">
                ${item.kana}
            </div>

        `;


        createMeaningChoices(
            item
        );

    }


    /* =================================================
       INDONESIA → KANJI
    ================================================= */

    else {

        document.getElementById(
            "questionType"
        ).textContent =
            "Pilih kanji / kosakata Jepang yang sesuai";


        question.className =
            "question";


        question.innerHTML = `

            <div class="question-indonesia">
                ${item.meaning}
            </div>

        `;


        createJapaneseChoices(
            item
        );

    }

}


/* =====================================================
   CREATE MEANING CHOICES
===================================================== */

function createMeaningChoices(
    correct
) {

    const wrong =
        shuffle(

            vocabulary.filter(
                item =>
                    item.meaning !==
                    correct.meaning
            )

        ).slice(0, 3);


    const answerList =
        shuffle([

            correct.meaning,

            ...wrong.map(
                item =>
                    item.meaning
            )

        ]);


    renderChoices(
        answerList,
        correct.meaning
    );

}


/* =====================================================
   CREATE JAPANESE CHOICES
===================================================== */

function createJapaneseChoices(
    correct
) {

    const wrong =
        shuffle(

            vocabulary.filter(
                item =>
                    item.jp !==
                    correct.jp
            )

        ).slice(0, 3);


    const answerList =
        shuffle([

            correct.jp,

            ...wrong.map(
                item =>
                    item.jp
            )

        ]);


    renderChoices(
        answerList,
        correct.jp
    );

}


/* =====================================================
   RENDER
===================================================== */

function renderChoices(
    answerList,
    correctAnswer
) {

    choices.innerHTML = "";


    answerList.forEach(
        answer => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "choice";


            button.textContent =
                answer;


            button.onclick =
                function() {

                    checkAnswer(
                        button,
                        answer,
                        correctAnswer
                    );

                };


            choices.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(
    clicked,
    selected,
    correct
) {

    if (answered)
        return;


    answered = true;


    const buttons =
        document.querySelectorAll(
            ".choice"
        );


    buttons.forEach(
        button => {

            button.disabled =
                true;


            if (
                button.textContent ===
                correct
            ) {

                button.classList.add(
                    "correct"
                );

            }

        }
    );


    /* ============================
       BENAR
    ============================ */

    if (
        selected ===
        correct
    ) {

        score++;

        scoreEl.textContent =
            score;


        clicked.classList.add(
            "correct"
        );


        result.textContent =
            "✓ Benar!";


        result.className =
            "result correct";

    }


    /* ============================
       SALAH
    ============================ */

    else {

        clicked.classList.add(
            "wrong"
        );


        result.textContent =
            "✕ Salah — jawaban yang benar: "
            +
            correct;


        result.className =
            "result wrong";

    }


    nextBtn.style.display =
        "block";

}


/* =====================================================
   NEXT BUTTON
===================================================== */

nextBtn.onclick =
    function() {

        currentIndex++;

        showQuestion();

    };


/* =====================================================
   CHAPTER BUTTON
===================================================== */

document
    .querySelectorAll(
        ".chapter-btn"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function() {


                    document
                        .querySelectorAll(
                            ".chapter-btn"
                        )
                        .forEach(
                            btn =>
                                btn.classList
                                    .remove(
                                        "active"
                                    )
                        );


                    this.classList.add(
                        "active"
                    );


                    selectedChapter =
                        this.dataset.chapter;


                    startQuiz();

                }

            );

        }
    );


/* =====================================================
   MODE BUTTON
===================================================== */

document
    .querySelectorAll(
        ".mode-btn"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function() {


                    document
                        .querySelectorAll(
                            ".mode-btn"
                        )
                        .forEach(
                            btn =>
                                btn.classList
                                    .remove(
                                        "active"
                                    )
                        );


                    this.classList.add(
                        "active"
                    );


                    selectedMode =
                        this.dataset.mode;


                    startQuiz();

                }

            );

        }
    );


/* =====================================================
   RESTART
===================================================== */

document
    .getElementById(
        "restartBtn"
    )
    .onclick =
    function() {

        startQuiz();

    };


/* =====================================================
   FINISH
===================================================== */

function showFinish() {

    const percentage =
        Math.round(
            (
                score /
                questions.length
            ) * 100
        );


    progressBar.style.width =
        "100%";


    questionNumber.textContent =
        `${questions.length} / ${questions.length}`;


    chapterBadge.textContent =
        "QUIZ SELESAI";


    document.getElementById(
        "questionType"
    ).textContent =
        "おつかれさまでした！";


    question.innerHTML = `

        <div class="finish">

            <div class="finish-japanese">
                よくできました！
            </div>

            <div class="finish-score">
                ${score}/${questions.length}
            </div>

            <div class="finish-text">
                Skor kamu: ${percentage}%<br><br>

                Coba ulangi lagi untuk
                memperkuat ingatan
                kanji dan kotoba Bab 41–42.
            </div>

            <button
                class="finish-btn"
                onclick="startQuiz()"
            >
                ↻ Coba Lagi
            </button>

        </div>

    `;


    choices.innerHTML = "";

    result.innerHTML = "";

    nextBtn.style.display =
        "none";

}


/* =====================================================
   START
===================================================== */

startQuiz();

</script>

</body>
</html>
