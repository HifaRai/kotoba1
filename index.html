/* =====================================================
   QUIZ STATE
===================================================== */

let quiz4142Questions = [];

let quiz4142Index = 0;

let quiz4142Score = 0;

let quiz4142Answered = false;


/* =====================================================
   SHUFFLE
===================================================== */

function quiz4142Shuffle(array) {

  const result = [...array];

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }

  return result;
}


/* =====================================================
   GET DATABASE SESUAI BAB
===================================================== */

function quiz4142GetData() {

  const chapter =
    document.getElementById(
      "quiz4142Chapter"
    ).value;


  if (chapter === "all") {

    return [
      ...quiz4142Data[41],
      ...quiz4142Data[42]
    ];

  }


  return [
    ...quiz4142Data[chapter]
  ];

}


/* =====================================================
   CREATE OPTIONS
===================================================== */

function quiz4142CreateOptions(
  correct,
  data,
  mode
) {

  const options = [correct];

  const shuffled =
    quiz4142Shuffle(data);


  for (const item of shuffled) {

    let value;


    if (mode === "jp-id") {

      value = item.meaning;

    } else {

      value = item.word;

    }


    if (
      value !== correct &&
      !options.includes(value)
    ) {

      options.push(value);

    }


    if (options.length >= 4) {
      break;
    }

  }


  return quiz4142Shuffle(options);

}


/* =====================================================
   GENERATE QUIZ
===================================================== */

function quiz4142Generate() {

  const data =
    quiz4142GetData();


  const selectedMode =
    document.getElementById(
      "quiz4142Mode"
    ).value;


  let questionCount =
    Number(
      document.getElementById(
        "quiz4142Count"
      ).value
    );


  questionCount =
    Math.min(
      questionCount,
      data.length
    );


  const selectedQuestions =
    quiz4142Shuffle(data)
      .slice(
        0,
        questionCount
      );


  quiz4142Questions =
    selectedQuestions.map(item => {

      let mode =
        selectedMode;


      /* ==========================
         MODE CAMPUR
      ========================== */

      if (mode === "mixed") {

        mode =
          Math.random() < 0.5
            ? "jp-id"
            : "id-jp";

      }


      let question;

      let correct;


      /* ==========================
         KANJI → INDONESIA
      ========================== */

      if (mode === "jp-id") {

        question =
          item.word;

        correct =
          item.meaning;

      }


      /* ==========================
         INDONESIA → KANJI
      ========================== */

      else {

        question =
          item.meaning;

        correct =
          item.word;

      }


      const options =
        quiz4142CreateOptions(
          correct,
          data,
          mode
        );


      return {

        item: item,

        mode: mode,

        question: question,

        correct: correct,

        options: options

      };

    });

}

  const current =
    quiz4142Questions[
      quiz4142Index

  if (!current) {

    quiz4142Finish();

    return;

  quiz4142Answered = false;


  /* ==========================
     PROGRESS
  ========================== */

  document.getElementById(
    "quiz4142Progress"
  ).textContent =
    `${quiz4142Index + 1} / ${quiz4142Questions.length}`;


  document.getElementById(
    "quiz4142Score"
  ).textContent =
    `Skor: ${quiz4142Score}`;


  const progress =
    (
      quiz4142Index /
      quiz4142Questions.length
    ) * 100;


  document.getElementById(
    "quiz4142ProgressBar"
  ).style.width =
    `${progress}%`;


  /* ==========================
     DIRECTION
  ========================== */

  document.getElementById(
    "quiz4142Direction"
  ).textContent =
    current.mode === "jp-id"
      ? "Kanji → Indonesia"
      : "Indonesia → Kanji";


  /* ==========================
     QUESTION
  ========================== */

  document.getElementById(
    "quiz4142Question"
  ).textContent =
    current.question;


  /* ==========================
     READING
  ========================== */

  /*
   * Reading sengaja tidak ditampilkan.
   *
   * Pada Kanji → Indonesia,
   * reading akan menjadi clue.
   */

  document.getElementById(
    "quiz4142Reading"
  ).textContent = "";


  /* ==========================
     ANSWERS
  ========================== */

  const answers =
    document.getElementById(
      "quiz4142Answers"
    );


  answers.innerHTML = "";


  current.options.forEach(
    option => {

      const button =
        document.createElement(
          "button"
        );


      button.type = "button";


      button.className =
        "quiz4142-answer";


      button.textContent =
        option;


      button.addEventListener(
        "click",
        function() {

          quiz4142Answer(
            button,
            option
          );

        }
      );


      answers.appendChild(
        button
      );

    }
  );


  /* ==========================
     RESET FEEDBACK
  ========================== */

  const feedback =
    document.getElementById(
      "quiz4142Feedback"
    );


  feedback.textContent = "";


  feedback.className =
    "quiz4142-feedback";


  /* ==========================
     HIDE NEXT
  ========================== */

  document.getElementById(
    "quiz4142Next"
  ).style.display =
    "none";

}


/* =====================================================
   ANSWER
===================================================== */

function quiz4142Answer(
  selectedButton,
  selectedAnswer
) {

  if (quiz4142Answered) {
    return;
  }


  quiz4142Answered = true;


  const current =
    quiz4142Questions[
      quiz4142Index
    ];


  /* ==========================
     DISABLE ALL BUTTONS
  ========================== */

  const buttons =
    document.querySelectorAll(
      "#quiz4142Answers .quiz4142-answer"
    );


  buttons.forEach(
    button => {

      button.disabled = true;


      if (
        button.textContent ===
        current.correct
      ) {

        button.classList.add(
          "correct"
        );

      }

    }
  );


  const feedback =
    document.getElementById(
      "quiz4142Feedback"
    );


  /* ==========================
     BENAR
  ========================== */

  if (
    selectedAnswer ===
    current.correct
  ) {

    quiz4142Score++;


    selectedButton.classList.add(
      "correct"
    );


    feedback.textContent =
      "✓ Benar!";


    feedback.classList.add(
      "correct"
    );

  }


  /* ==========================
     SALAH
  ========================== */

  else {

    selectedButton.classList.add(
      "wrong"
    );


    feedback.textContent =
      `Jawaban yang benar: ${current.correct}`;


    feedback.classList.add(
      "wrong"
    );

  }


  /* ==========================
     UPDATE SCORE
  ========================== */

  document.getElementById(
    "quiz4142Score"
  ).textContent =
    `Skor: ${quiz4142Score}`;


  /* ==========================
     SHOW NEXT
  ========================== */

  document.getElementById(
    "quiz4142Next"
  ).style.display =
    "block";

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function quiz4142NextQuestion() {

  quiz4142Index++;


  if (
    quiz4142Index >=
    quiz4142Questions.length
  ) {

    quiz4142Finish();

    return;

  }


  quiz4142ShowQuestion();

}


/* =====================================================
   FINISH
===================================================== */

function quiz4142Finish() {

  document.getElementById(
    "quiz4142Game"
  ).style.display =
    "none";


  document.getElementById(
    "quiz4142Result"
  ).style.display =
    "block";


  const total =
    quiz4142Questions.length;


  const percentage =
    total > 0
      ? Math.round(
          (
            quiz4142Score /
            total
          ) * 100
        )
      : 0;


  document.getElementById(
    "quiz4142ProgressBar"
  ).style.width =
    "100%";


  document.getElementById(
    "quiz4142FinalScore"
  ).textContent =
    `${quiz4142Score} / ${total}`;


  document.getElementById(
    "quiz4142FinalText"
  ).textContent =
    `${percentage}% benar`;

}


/* =====================================================
   RESTART
===================================================== */

function quiz4142Restart() {

  document.getElementById(
    "quiz4142Result"
  ).style.display =
    "none";


  document.getElementById(
    "quiz4142Game"
  ).style.display =
    "none";


  document.getElementById(
    "quiz4142Setup"
  ).style.display =
    "block";


  quiz4142Questions = [];

  quiz4142Index = 0;

  quiz4142Score = 0;

  quiz4142Answered = false;

}


/* =====================================================
   EVENT LISTENER
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {


    const startButton =
      document.getElementById(
        "quiz4142StartButton"
      );


    const nextButton =
      document.getElementById(
        "quiz4142Next"
      );


    const restartButton =
      document.getElementById(
        "quiz4142Restart"
      );


    /* START */

    if (startButton) {

      startButton.addEventListener(
        "click",
        quiz4142Start
      );

    }


    /* NEXT */

    if (nextButton) {

      nextButton.addEventListener(
        "click",
        quiz4142NextQuestion
      );

    }


    /* RESTART */

    if (restartButton) {

      restartButton.addEventListener(
        "click",
        quiz4142Restart
      );

    }

  }
);

</script>
